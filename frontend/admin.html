<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CUBE - 관리자 페이지</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .admin-main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    .admin-form { display: flex; flex-wrap: wrap; gap: 8px; padding: 16px; background: var(--white); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 20px; }
    .admin-form input, .admin-form select { padding: 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.85rem; }
    .admin-form label.checkbox { display: flex; align-items: center; gap: 4px; font-size: 0.85rem; color: var(--text-muted); }
    .admin-table { width: 100%; border-collapse: collapse; background: var(--white); }
    .admin-table th { background: var(--green-lighter); color: #1f4d33; padding: 10px; text-align: left; }
    .admin-table td { padding: 10px; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
    .role-badge { padding: 3px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; }
    .role-badge.admin { background: var(--danger); color: #fff; }
    .role-badge.teacher { background: var(--mint); color: #1a3d40; }
    #admin-msg { font-size: 0.85rem; color: var(--danger); min-height: 1.2em; }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="logo">CUBE</div>
    <nav class="tab-nav">
      <span style="font-weight:700;">관리자 페이지</span>
    </nav>
    <div class="user-box">
      <a href="index.html" class="btn btn-ghost">메인으로</a>
    </div>
  </header>

  <main class="admin-main">
    <div class="section-header">
      <h2>교사 등록</h2>
    </div>
    <form id="create-form" class="admin-form">
      <input name="name" placeholder="이름" required />
      <select name="role">
        <option value="teacher">teacher</option>
        <option value="admin">admin</option>
      </select>
      <select name="department" required>
        <option value="교무부">교무부</option>
        <option value="연구부">연구부</option>
        <option value="과학정보부">과학정보부</option>
        <option value="창의체험부">창의체험부</option>
        <option value="생활안전부">생활안전부</option>
      </select>
      <input name="subject" placeholder="과목 (선택)" />
      <label class="checkbox"><input type="checkbox" name="is_homeroom" /> 담임</label>
      <input name="grade" type="number" min="1" max="3" placeholder="학년" style="width:70px" />
      <input name="class_no" type="number" min="1" placeholder="반" style="width:70px" />
      <input name="extension" placeholder="내선번호" required style="width:100px" />
      <button type="submit" class="btn btn-primary">등록</button>
    </form>
    <p id="admin-msg"></p>

    <div class="section-header">
      <h2>교사 목록</h2>
    </div>
    <table class="admin-table">
      <thead>
        <tr>
          <th>ID</th><th>이름</th><th>권한</th><th>부서</th><th>과목</th>
          <th>담임</th><th>학년/반</th><th>내선</th><th>관리</th>
        </tr>
      </thead>
      <tbody id="teacher-table-body"></tbody>
    </table>
  </main>

  <script>
    const API_BASE = "http://127.0.0.1:8000";
    const msgEl = document.getElementById("admin-msg");

    function showMsg(text) {
      msgEl.textContent = text;
      setTimeout(() => (msgEl.textContent = ""), 3000);
    }

    async function loadTeachers() {
      const res = await fetch(`${API_BASE}/teachers`);
      const teachers = await res.json();
      const tbody = document.getElementById("teacher-table-body");
      tbody.innerHTML = teachers
        .map(
          (t) => `
        <tr>
          <td>${t.id}</td>
          <td>${t.name}</td>
          <td><span class="role-badge ${t.role}">${t.role}</span></td>
          <td>${t.department}</td>
          <td>${t.subject ?? "-"}</td>
          <td>${t.is_homeroom ? "Y" : "-"}</td>
          <td>${t.is_homeroom ? `${t.grade}학년 ${t.class_no}반` : "-"}</td>
          <td>${t.extension}</td>
          <td><button class="btn btn-ghost" onclick="toggleRole(${t.id}, '${t.role}')">권한 전환</button></td>
        </tr>`
        )
        .join("");
    }

    async function toggleRole(id, currentRole) {
      const newRole = currentRole === "admin" ? "teacher" : "admin";
      const res = await fetch(`${API_BASE}/teachers/${id}/role`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ role: newRole }),
      });
      if (!res.ok) {
        showMsg("권한 변경 실패");
        return;
      }
      loadTeachers();
    }

    document.getElementById("create-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const data = new FormData(form);
      const payload = {
        name: data.get("name"),
        role: data.get("role"),
        department: data.get("department"),
        subject: data.get("subject") || null,
        is_homeroom: form.querySelector("[name=is_homeroom]").checked,
        grade: data.get("grade") ? Number(data.get("grade")) : null,
        class_no: data.get("class_no") ? Number(data.get("class_no")) : null,
        extension: data.get("extension"),
      };

      const res = await fetch(`${API_BASE}/teachers`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        showMsg("등록 실패: " + (err.detail || res.status));
        return;
      }

      form.reset();
      loadTeachers();
    });

    loadTeachers();
  </script>

</body>
</html>
