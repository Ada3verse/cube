<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CUBE - 교무행정 통합 플랫폼</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 로그인 화면 -->
  <section id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-logo">CUBE</div>
      <p class="login-sub">교무행정 통합 플랫폼</p>
      <form id="login-form" class="login-form">
        <label for="login-name">이름</label>
        <input id="login-name" type="text" placeholder="예: 방인배" required autocomplete="username" />

        <label for="login-password">비밀번호</label>
        <input id="login-password" type="password" placeholder="비밀번호" required autocomplete="current-password" />

        <p id="login-error" class="login-error"></p>

        <button type="submit" class="btn btn-primary">로그인</button>
      </form>
      <p class="login-hint">초기 비밀번호: 123456</p>
    </div>
  </section>

  <!-- 로그인 후 앱 화면 -->
  <div id="app" class="hidden">
    <header class="app-header">
      <div class="logo">CUBE</div>
      <nav class="tab-nav">
        <button class="tab-btn active" data-tab="calendar">캘린더</button>
        <button class="tab-btn" data-tab="notice">공지등록</button>
        <button class="tab-btn" data-tab="submission">제출현황</button>
      </nav>
      <div class="user-box">
        <span id="current-user-name"></span>
        <button id="logout-btn" class="btn btn-ghost">로그아웃</button>
      </div>
    </header>

    <main class="app-main">
      <!-- 캘린더 섹션 (4주 단위) -->
      <section id="calendar" class="tab-panel active">
        <div class="section-header">
          <button id="prev-week">&lt;</button>
          <div class="calendar-range-group">
            <h2 id="calendar-range"></h2>
            <button id="today-btn" class="today-btn">오늘</button>
          </div>
          <button id="next-week">&gt;</button>
        </div>
        <div id="calendar-scroll-area" class="calendar-scroll-area">
          <table class="calendar-table">
            <thead>
              <tr>
                <th>일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th>
              </tr>
            </thead>
            <tbody id="calendar-body">
              <!-- calendar.js 가 채웁니다 -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- 공지등록 섹션 -->
      <section id="notice" class="tab-panel">
        <div class="section-header">
          <h2>공지등록</h2>
        </div>
        <form id="notice-form" class="notice-form">
          <label for="notice-title">제목</label>
          <input id="notice-title" type="text" placeholder="공지 제목" required />

          <label for="notice-content">내용 (@이름 으로 교사 지정 가능)</label>
          <textarea id="notice-content" rows="4" placeholder="공지 내용을 입력하세요. 예) @김민준 확인 부탁드립니다."></textarea>

          <label for="notice-deadline">마감일</label>
          <input id="notice-deadline" type="date" required />

          <button type="submit" class="btn btn-primary">등록</button>
        </form>

        <ul id="notice-list" class="notice-list"></ul>
      </section>

      <!-- 제출현황 섹션 -->
      <section id="submission" class="tab-panel">
        <div class="section-header">
          <h2>제출현황</h2>
        </div>
        <table class="submission-table" id="submission-table">
          <thead>
            <tr>
              <th>공지</th><th>교사</th><th>상태</th>
            </tr>
          </thead>
          <tbody id="submission-body">
            <!-- yamako가 채울 예정 -->
          </tbody>
        </table>
      </section>
    </main>

    <div id="today-popup" class="today-popup hidden"></div>

    <!-- 로그인 직후 환영 팝업 (오늘 첫 로그인 시 1회만) -->
    <div id="greeting-modal" class="alarm-dday-overlay hidden">
      <div class="greeting-card">
        <p id="greeting-title" class="greeting-title"></p>
        <p id="greeting-quote" class="greeting-quote"></p>
        <button id="greeting-confirm" class="btn btn-primary">확인</button>
      </div>
    </div>

    <!-- 스마트 알람: 1주 전(소프트) / 3일 전(경고) 코너 팝업 -->
    <div id="alarm-soft-popup" class="alarm-corner-popup hidden"></div>
    <div id="alarm-warn-popup" class="alarm-corner-popup alarm-warn hidden"></div>

    <!-- 스마트 알람: D-DAY 전면 강제 모달 (확인 버튼으로만 닫힘) -->
    <div id="alarm-dday-modal" class="alarm-dday-overlay hidden">
      <div class="alarm-dday-card">
        <div id="alarm-dday-body"></div>
      </div>
    </div>

    <!-- 날짜 상세 모달 -->
    <div id="day-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3 id="modal-date-title"></h3>
          <button id="modal-close" class="modal-close">&times;</button>
        </div>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>
  </div>

  <script src="js/calendar.js"></script>
  <script src="js/submission.js"></script>
  <script type="module" src="js/notice.js"></script>
  <script type="module" src="js/notification.js"></script>
  <script src="js/alarm.js"></script>
  <script src="js/messages.js"></script>
  <script type="module" src="js/cube-widget.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const tabButtons = document.querySelectorAll(".tab-btn");
    const tabPanels = document.querySelectorAll(".tab-panel");

    tabButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        tabButtons.forEach((b) => b.classList.remove("active"));
        tabPanels.forEach((p) => p.classList.remove("active"));

        btn.classList.add("active");
        document.getElementById(btn.dataset.tab).classList.add("active");
      });
    });
  </script>
</body>
</html>
