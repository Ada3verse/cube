<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CUBE - 교무행정 통합 플랫폼</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" />
</head>
<body>
  <!-- 로그인 화면 -->
  <section id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-logo">CUBE</div>
      <p class="login-sub">교무행정 통합 플랫폼</p>
      <form id="login-form" class="login-form">
        <label for="login-name">이름</label>
        <input id="login-name" type="text" placeholder="예: 방인배" required autocomplete="username" />

        <label for="login-password">비밀번호</label>
        <input id="login-password" type="password" placeholder="비밀번호" required autocomplete="current-password" />

        <p id="login-error" class="login-error"></p>

        <button type="submit" class="btn btn-primary">로그인</button>
      </form>
      <p class="login-hint">초기 비밀번호: 123456</p>
    </div>
  </section>

  <!-- 로그인 후 앱 화면 -->
  <div id="app" class="hidden">
    <header class="app-header">
      <div class="logo">CUBE</div>
      <nav class="tab-nav">
        <button class="tab-btn active" data-tab="calendar">캘린더</button>
        <button class="tab-btn" data-tab="notice">공지등록</button>
        <button class="tab-btn" data-tab="submission">제출현황</button>
      </nav>
      <div class="user-box">
        <span id="current-user-name"></span>
        <button id="logout-btn" class="btn btn-ghost">로그아웃</button>
      </div>
    </header>

    <main class="app-main">
      <!-- 캘린더 섹션 (4주 단위) -->
      <section id="calendar" class="tab-panel active">
        <div class="section-header">
          <button id="prev-week">&lt;</button>
          <div class="calendar-range-group">
            <h2 id="calendar-range"></h2>
            <button id="today-btn" class="today-btn">오늘</button>
          </div>
          <button id="next-week">&gt;</button>
        </div>
        <div id="calendar-scroll-area" class="calendar-scroll-area">
          <table class="calendar-table">
            <thead>
              <tr>
                <th>일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th>
              </tr>
            </thead>
            <tbody id="calendar-body">
              <!-- calendar.js 가 채웁니다 -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- 공지등록 섹션 -->
      <section id="notice" class="tab-panel">
        <div class="section-header">
          <h2>공지등록</h2>
        </div>
        <form id="notice-form" class="notice-form">
          <label for="notice-title">제목</label>
          <input id="notice-title" type="text" placeholder="공지 제목" required />

          <label for="notice-content">내용 (@이름 으로 교사 지정 가능)</label>
          <textarea id="notice-content" rows="4" placeholder="공지 내용을 입력하세요. 예) @김민준 확인 부탁드립니다."></textarea>

          <label for="notice-deadline">마감일</label>
          <input id="notice-deadline" type="date" required />

          <button type="submit" class="btn btn-primary">등록</button>
        </form>

        <ul id="notice-list" class="notice-list"></ul>
      </section>

      <!-- 제출현황 섹션 -->
      <section id="submission" class="tab-panel">
        <div class="section-header">
          <h2>제출현황</h2>
        </div>
        <div id="submission-app"></div>
      </section>
    </main>

    <div id="today-popup" class="today-popup hidden"></div>

    <!-- 로그인 직후 환영 팝업 (오늘 첫 로그인 시 1회만) -->
    <div id="greeting-modal" class="alarm-dday-overlay hidden">
      <div class="greeting-card">
        <p id="greeting-title" class="greeting-title"></p>
        <p id="greeting-quote" class="greeting-quote"></p>
        <button id="greeting-confirm" class="btn btn-primary">확인</button>
      </div>
    </div>

    <!-- 스마트 알람: 1주 전(소프트) / 3일 전(경고) 코너 팝업 -->
    <div id="alarm-soft-popup" class="alarm-corner-popup hidden"></div>
    <div id="alarm-warn-popup" class="alarm-corner-popup alarm-warn hidden"></div>

    <!-- 스마트 알람: D-DAY 전면 강제 모달 (확인 버튼으로만 닫힘) -->
    <div id="alarm-dday-modal" class="alarm-dday-overlay hidden">
      <div class="alarm-dday-card">
        <div id="alarm-dday-body"></div>
      </div>
    </div>

    <!-- 날짜 상세 모달 -->
    <div id="day-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3 id="modal-date-title"></h3>
          <button id="modal-close" class="modal-close">&times;</button>
        </div>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>

    <!-- 플로팅 설정 버튼: 글자크기/테마색/비밀번호 변경 + (관리자만) 관리자 페이지 -->
    <button id="settings-fab-btn" class="settings-fab" title="설정">
      <span class="material-symbols-outlined">settings</span>
    </button>

    <!-- 설정 모달 -->
    <div id="settings-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3>설정</h3>
          <button id="settings-modal-close" class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
          <div id="settings-menu">
            <button class="settings-menu-btn" onclick="showSettingsPanel('fontsize')">
              <span class="material-symbols-outlined">format_size</span> 글자 크기
            </button>
            <button class="settings-menu-btn" onclick="showSettingsPanel('theme')">
              <span class="material-symbols-outlined">palette</span> 테마 색상
            </button>
            <button class="settings-menu-btn" onclick="showSettingsPanel('password')">
              <span class="material-symbols-outlined">lock</span> 비밀번호 변경
            </button>
            <button id="settings-admin-link" class="settings-menu-btn hidden" onclick="location.href='admin.html'">
              <span class="material-symbols-outlined">admin_panel_settings</span> 관리자 페이지
            </button>
          </div>

          <div id="settings-panel-fontsize" class="settings-panel hidden">
            <button class="settings-back-btn" onclick="showSettingsMenu()">&larr; 뒤로</button>
            <p class="settings-panel-label">글자 크기</p>
            <div class="settings-choice-row">
              <button class="settings-choice-btn" data-fontsize="small" onclick="setFontSize('small')">작게</button>
              <button class="settings-choice-btn" data-fontsize="medium" onclick="setFontSize('medium')">보통</button>
              <button class="settings-choice-btn" data-fontsize="large" onclick="setFontSize('large')">크게</button>
            </div>
          </div>

          <div id="settings-panel-theme" class="settings-panel hidden">
            <button class="settings-back-btn" onclick="showSettingsMenu()">&larr; 뒤로</button>
            <p class="settings-panel-label">테마 색상</p>
            <div class="settings-choice-row">
              <button class="theme-swatch-btn" data-theme="green" style="--swatch:#6fb3b8" onclick="setThemeColor('green')" title="그린"></button>
              <button class="theme-swatch-btn" data-theme="blue" style="--swatch:#5f8fb3" onclick="setThemeColor('blue')" title="블루"></button>
              <button class="theme-swatch-btn" data-theme="lavender" style="--swatch:#8f6fb3" onclick="setThemeColor('lavender')" title="라벤더"></button>
              <button class="theme-swatch-btn" data-theme="peach" style="--swatch:#b3835f" onclick="setThemeColor('peach')" title="피치"></button>
            </div>
          </div>

          <div id="settings-panel-password" class="settings-panel hidden">
            <button class="settings-back-btn" onclick="showSettingsMenu()">&larr; 뒤로</button>
            <p class="settings-panel-label">비밀번호 변경</p>
            <form id="password-change-form" class="settings-form">
              <input type="password" id="pw-current" placeholder="현재 비밀번호" required autocomplete="current-password" />
              <input type="password" id="pw-new" placeholder="새 비밀번호" required autocomplete="new-password" />
              <input type="password" id="pw-confirm" placeholder="새 비밀번호 확인" required autocomplete="new-password" />
              <button type="submit" class="btn btn-primary">변경</button>
            </form>
            <p id="pw-change-msg" class="admin-msg"></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/calendar.js"></script>
  <script src="js/submission.js"></script>
  <script type="module" src="js/notice.js"></script>
  <script type="module" src="js/notification.js"></script>
  <script src="js/alarm.js"></script>
  <script src="js/messages.js"></script>
  <script type="module" src="js/cube-widget.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/settings.js"></script>
  <script>
    const tabButtons = document.querySelectorAll(".tab-btn");
    const tabPanels = document.querySelectorAll(".tab-panel");

    tabButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        tabButtons.forEach((b) => b.classList.remove("active"));
        tabPanels.forEach((p) => p.classList.remove("active"));

        btn.classList.add("active");
        document.getElementById(btn.dataset.tab).classList.add("active");
      });
    });
  </script>
</body>
</html>
